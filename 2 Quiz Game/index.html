<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="quiz-container">

        <h1>Quiz Time !</h1>
        <div class="quiz-header">
            <p id="progress">Question 1 of 5</p>
            <h2 id="question">What is the capital of France?</h2>
        </div>

        <div class="options">
            <button class="option">A. Berlin</button>
            <button class="option">B. Madrid</button>
            <button class="option">C. Rome</button>
            <button class="option">D. Paris</button>
        </div>

        <button id="next-btn">Next</button>

    </div>


<script src="script.js"></script>
</body>
</html>
